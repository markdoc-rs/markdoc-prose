[package]
name = "markdoc-prose"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/markdoc-rc/markdoc-prose"
description = "Prose linting for a Markdoc corpus, on harper-core"

[lib]
name = "markdoc_prose"
path = "src/lib.rs"

[[bin]]
name = "markdoc-prose"
path = "src/bin/markdoc_prose.rs"

[dependencies]
markdoc-lint = { path = "../markdoc-lint", version = "0.1.0" }
# The grammar and style engine. `thesaurus` is off: it is a large data table
# this never consults, and it costs build time and binary size on a tool
# writers install.
harper-core = { version = "3.0.0", default-features = false }
regex = "1.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
anyhow = "1.0.104"
fancy-regex = "0.20.0"
